name: skill-ci

on:
  push:
  pull_request:

jobs:
  structural-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint skill structure (required files, links, encoding, contract phrases)
        run: python scripts/lint_skill.py
      - name: Verify fixture is still deliberately broken
        run: python scripts/check_fixture.py
